<!DOCTYPE html>
<html>
  <head>
    <title>Arena Showdown</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* CSS Reset */
      *, *::before, *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      /* Custom Properties */
      :root {
          --transition-fast: 150ms;
          --transition-normal: 300ms;
          --transition-slow: 500ms;
          --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
          --ease-bounce: cubic-bezier(0.68, -0.6, 0.32, 1.6);
          --space-xs: 8px;
          --space-sm: 16px;
          --space-md: 24px;
          --space-lg: 32px;
          --space-xl: 48px;
          --red-team: #ff3333;
          --blue-team: #3366ff;
          --neutral: #808080;
      }

      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          touch-action: none;
          -ms-touch-action: none;
          font-family: 'Inter', sans-serif;
      }

      #game-world {
          position: relative;
          width: 100%;
          height: 100%;
          background-color: #000;
      }

      #game-canvas {
          width: 100%;
          height: 100%;
          display: block;
      }

      /* UI Overlay Container */
      .ui-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
      }

      .ui-overlay > * {
          pointer-events: auto;
      }

      /* Team Selection Screen */
      #team-selection {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 1000;
      }

      #team-selection h1 {
          font-family: 'Orbitron', sans-serif;
          font-size: 56px;
          font-weight: 900;
          color: #fff;
          margin-bottom: var(--space-xl);
          text-transform: uppercase;
          letter-spacing: 4px;
          text-shadow: 0 4px 8px rgba(0,0,0,0.5);
      }

      .team-buttons {
          display: flex;
          gap: var(--space-lg);
      }

      .team-btn {
          width: 280px;
          height: 280px;
          border: none;
          border-radius: 16px;
          font-family: 'Orbitron', sans-serif;
          font-size: 40px;
          font-weight: 700;
          color: #fff;
          cursor: pointer;
          transition: transform var(--transition-normal) var(--ease-out),
                      box-shadow var(--transition-normal) var(--ease-out);
          text-transform: uppercase;
          letter-spacing: 2px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: var(--space-md);
      }

      .team-btn:hover {
          transform: translateY(-8px);
          box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      }

      .team-btn:active {
          transform: translateY(-4px);
      }

      .team-btn.red {
          background: linear-gradient(135deg, var(--red-team) 0%, #cc0000 100%);
          box-shadow: 0 8px 24px rgba(255, 51, 51, 0.4);
      }

      .team-btn.blue {
          background: linear-gradient(135deg, var(--blue-team) 0%, #0044cc 100%);
          box-shadow: 0 8px 24px rgba(51, 102, 255, 0.4);
      }

      /* HUD */
      .hud {
          position: absolute;
          pointer-events: none;
      }

      /* Top HUD */
      .top-hud {
          top: var(--space-sm);
          left: var(--space-sm);
          right: var(--space-sm);
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
      }

      .score-panel {
          background: rgba(0, 0, 0, 0.7);
          padding: var(--space-sm) var(--space-md);
          border-radius: 8px;
          backdrop-filter: blur(8px);
      }

      .team-score {
          display: flex;
          gap: var(--space-md);
          align-items: center;
          margin-bottom: var(--space-xs);
      }

      .team-score-item {
          display: flex;
          align-items: center;
          gap: var(--space-xs);
          font-size: 32px;
          font-weight: 700;
      }

      .team-score-item.red {
          color: var(--red-team);
      }

      .team-score-item.blue {
          color: var(--blue-team);
      }

      .timer {
          font-size: 28px;
          color: #fff;
          font-family: 'Orbitron', monospace;
          text-align: center;
      }

      .kill-feed {
          background: rgba(0, 0, 0, 0.7);
          padding: var(--space-sm);
          border-radius: 8px;
          backdrop-filter: blur(8px);
          min-width: 280px;
      }

      .kill-feed-item {
          font-size: 18px;
          color: #fff;
          margin-bottom: 4px;
          white-space: nowrap;
          animation: killFeedSlide 0.3s var(--ease-out);
      }

      @keyframes killFeedSlide {
          from {
              opacity: 0;
              transform: translateX(20px);
          }
          to {
              opacity: 1;
              transform: translateX(0);
          }
      }

      .kill-feed-item .killer {
          color: var(--red-team);
      }

      .kill-feed-item .victim {
          color: var(--blue-team);
      }

      /* Bottom HUD */
      .bottom-hud {
          bottom: var(--space-md);
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: var(--space-sm);
      }

      .health-ammo {
          display: flex;
          gap: var(--space-md);
          align-items: center;
      }

      .health-bar-container {
          width: 240px;
          height: 32px;
          background: rgba(0, 0, 0, 0.7);
          border-radius: 16px;
          padding: 4px;
          backdrop-filter: blur(8px);
      }

      .health-bar {
          height: 100%;
          background: linear-gradient(90deg, #00ff00 0%, #88ff00 100%);
          border-radius: 12px;
          transition: width 0.2s ease, background 0.2s ease;
          position: relative;
          overflow: hidden;
      }

      .health-bar.low {
          background: linear-gradient(90deg, #ffff00 0%, #ffaa00 100%);
      }

      .health-bar.critical {
          background: linear-gradient(90deg, #ff0000 0%, #ff4444 100%);
          animation: healthPulse 0.5s ease-in-out infinite;
      }

      @keyframes healthPulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.7; }
      }

      .health-text {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: #fff;
          font-weight: 700;
          font-size: 18px;
          text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      }

      .ammo-display {
          background: rgba(0, 0, 0, 0.7);
          padding: var(--space-sm) var(--space-md);
          border-radius: 8px;
          backdrop-filter: blur(8px);
          font-family: 'Orbitron', monospace;
          font-size: 28px;
          font-weight: 700;
          color: #fff;
      }

      .ammo-display .current {
          color: #00ff00;
      }

      .ammo-display .reserve {
          color: #888;
          font-size: 22px;
      }

      /* Crosshair */
      .crosshair {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 32px;
          height: 32px;
          pointer-events: none;
      }

      .crosshair::before,
      .crosshair::after {
          content: '';
          position: absolute;
          background: rgba(255, 255, 255, 0.8);
      }

      .crosshair::before {
          top: 50%;
          left: 12px;
          right: 12px;
          height: 2px;
          transform: translateY(-1px);
      }

      .crosshair::after {
          left: 50%;
          top: 12px;
          bottom: 12px;
          width: 2px;
          transform: translateX(-1px);
      }

      /* Minimap */
      .minimap {
          position: absolute;
          top: var(--space-sm);
          right: var(--space-sm);
          width: 160px;
          height: 160px;
          background: rgba(0, 0, 0, 0.8);
          border: 2px solid rgba(255, 255, 255, 0.3);
          border-radius: 8px;
          backdrop-filter: blur(8px);
      }

      /* Damage Indicator */
      .damage-vignette {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          background: radial-gradient(circle at center, transparent 30%, rgba(255, 0, 0, 0.3) 100%);
          opacity: 0;
          transition: opacity 0.2s ease;
      }

      .damage-vignette.active {
          opacity: 1;
      }

      /* Hit Marker */
      .hit-marker {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 48px;
          height: 48px;
          pointer-events: none;
          opacity: 0;
      }

      .hit-marker.active {
          animation: hitMarkerPulse 0.2s ease-out;
      }

      @keyframes hitMarkerPulse {
          0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
      }

      .hit-marker::before,
      .hit-marker::after {
          content: '';
          position: absolute;
          background: #fff;
      }

      .hit-marker::before {
          top: 0;
          bottom: 0;
          left: 50%;
          width: 3px;
          transform: translateX(-50%) rotate(45deg);
      }

      .hit-marker::after {
          left: 0;
          right: 0;
          top: 50%;
          height: 3px;
          transform: translateY(-50%) rotate(45deg);
      }

      /* Elimination Notification */
      .elimination-notice {
          position: absolute;
          top: 35%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-family: 'Orbitron', sans-serif;
          font-size: 40px;
          font-weight: 900;
          color: #ffff00;
          text-transform: uppercase;
          pointer-events: none;
          opacity: 0;
          text-shadow: 0 4px 8px rgba(0,0,0,0.8),
                       0 0 20px rgba(255,255,0,0.6);
      }

      .elimination-notice.active {
          animation: eliminationPop 1s ease-out;
      }

      @keyframes eliminationPop {
          0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
          20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
          80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
      }

      /* Respawn Screen */
      .respawn-screen {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.8);
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 100;
      }

      .respawn-screen.active {
          display: flex;
      }
      .respawn-screen h2 {
          font-family: 'Orbitron', sans-serif;
          font-size: 48px;
          font-weight: 700;
          color: #ff0000;
          margin-bottom: var(--space-md);
          text-transform: uppercase;
      }

      .respawn-timer {
          font-family: 'Orbitron', monospace;
          font-size: 96px;
          font-weight: 900;
          color: #fff;
          text-shadow: 0 4px 8px rgba(0,0,0,0.8);
      }

      /* End Screen */
      .end-screen {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 1000;
      }

      .end-screen.active {
          display: flex;
      }

      .end-screen h1 {
          font-family: 'Orbitron', sans-serif;
          font-size: 72px;
          font-weight: 900;
          margin-bottom: var(--space-lg);
          text-transform: uppercase;
          letter-spacing: 4px;
          text-shadow: 0 4px 8px rgba(0,0,0,0.5);
      }

      .end-screen h1.victory {
          color: #00ff00;
      }

      .end-screen h1.defeat {
          color: #ff0000;
      }

      .final-score {
          font-size: 40px;
          color: #fff;
          margin-bottom: var(--space-xl);
      }

      .end-screen button {
          padding: var(--space-md) var(--space-xl);
          font-family: 'Orbitron', sans-serif;
          font-size: 28px;
          font-weight: 700;
          color: #fff;
          background: linear-gradient(135deg, #3366ff 0%, #0044cc 100%);
          border: none;
          border-radius: 8px;
          cursor: pointer;
          transition: transform var(--transition-normal) var(--ease-out);
          text-transform: uppercase;
      }

      .end-screen button:hover {
          transform: translateY(-4px);
      }

      /* Mobile Virtual Joysticks */
      .virtual-joystick {
          position: absolute;
          display: none;
          pointer-events: none;
      }

      .virtual-joystick.active {
          display: block;
      }

      .joystick-base {
          position: absolute;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.1);
          border: 3px solid rgba(255, 255, 255, 0.3);
          transform: translate(-50%, -50%);
      }

      .joystick-stick {
          position: absolute;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.5);
          border: 2px solid rgba(255, 255, 255, 0.8);
          transform: translate(-50%, -50%);
          transition: background 0.1s ease;
      }

      /* Mobile Shoot Button */
      .mobile-shoot-btn {
          position: absolute;
          bottom: var(--space-lg);
          right: var(--space-lg);
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: rgba(255, 0, 0, 0.7);
          border: 4px solid rgba(255, 255, 255, 0.8);
          display: none;
          pointer-events: auto;
          cursor: pointer;
          transition: transform var(--transition-fast) var(--ease-out);
      }

          baseStructure.castShadow = true;
          baseStructure.receiveShadow = true;
          base.add(baseStructure);
          addBoxCollider(baseStructure);

          // Roof
          const roofGeometry = new THREE.BoxGeometry(22, 0.5, 22);
          const roofMaterial = new THREE.MeshLambertMaterial({ color: color });
          const roof = new THREE.Mesh(roofGeometry, roofMaterial);
          roof.position.y = 5.25;
          roof.castShadow = true;
          base.add(roof);
          addBoxCollider(roof);

          // Platform
          const platformGeometry = new THREE.BoxGeometry(24, 1, 24);
          const platformMaterial = new THREE.MeshLambertMaterial({ color: 0x404040 });
          const platform = new THREE.Mesh(platformGeometry, platformMaterial);
          platform.position.y = 6;
          platform.castShadow = true;
          platform.receiveShadow = true;
          base.add(platform);
          addBoxCollider(platform);

          scene.add(base);
          return base;
        }

        function createCentralBuilding() {
          const building = new THREE.Group();

          // Ground floor
          const floor1Geometry = new THREE.BoxGeometry(30, 4, 30);
          const floor1Material = new THREE.MeshLambertMaterial({ color: 0x808080 });
          const floor1 = new THREE.Mesh(floor1Geometry, floor1Material);
          floor1.position.y = 2;
          floor1.castShadow = true;
          floor1.receiveShadow = true;
          building.add(floor1);
          addBoxCollider(floor1);

          // Second floor
          const floor2Geometry = new THREE.BoxGeometry(30, 4, 30);
          const floor2Material = new THREE.MeshLambertMaterial({ color: 0x707070 });
          const floor2 = new THREE.Mesh(floor2Geometry, floor2Material);
          floor2.position.y = 6;
          floor2.castShadow = true;
          floor2.receiveShadow = true;
          building.add(floor2);
          addBoxCollider(floor2);

          // Walls with windows
          const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x606060 });
          const wallGeometry = new THREE.BoxGeometry(30, 4, 2);

          const walls = [
            { pos: [0, 6, 15], rot: 0 },
            { pos: [0, 6, -15], rot: 0 },
            { pos: [15, 6, 0], rot: Math.PI / 2 },
            { pos: [-15, 6, 0], rot: Math.PI / 2 },
          ];

          walls.forEach((w) => {
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(...w.pos);
            wall.rotation.y = w.rot;
            wall.castShadow = true;
            wall.receiveShadow = true;
            building.add(wall);
            addBoxCollider(wall);
          });

          building.position.set(0, 0, 0);
          scene.add(building);
          return building;
        }

        function createSniperTower(position) {
          const tower = new THREE.Group();

          // Tower structure
          const towerGeometry = new THREE.BoxGeometry(3, 15, 3);
          const towerMaterial = new THREE.MeshLambertMaterial({ color: 0x505050 });
          const towerMesh = new THREE.Mesh(towerGeometry, towerMaterial);
          towerMesh.position.y = 7.5;
          towerMesh.castShadow = true;
          towerMesh.receiveShadow = true;
          tower.add(towerMesh);
          addBoxCollider(towerMesh);

          // Platform
          const platformGeometry = new THREE.BoxGeometry(5, 0.5, 5);
          const platformMaterial = new THREE.MeshLambertMaterial({ color: 0x606060 });
          const platform = new THREE.Mesh(platformGeometry, platformMaterial);
          platform.position.y = 15;
          platform.castShadow = true;
          platform.receiveShadow = true;
          tower.add(platform);
          addBoxCollider(platform);

          tower.position.copy(position);
          scene.add(tower);
          return tower;
        }

        function createCover(position, type = 'crate') {
          const coverGeometry =
            type === 'crate'
              ? new THREE.BoxGeometry(1.5, 1.5, 1.5)
              : new THREE.BoxGeometry(3, 1, 0.5);
          const coverMaterial = new THREE.MeshLambertMaterial({
            color: type === 'crate' ? 0x8b4513 : 0x606060,
          });
          const cover = new THREE.Mesh(coverGeometry, coverMaterial);
          cover.position.copy(position);
          cover.position.y = type === 'crate' ? 0.75 : 0.5;
          cover.castShadow = true;
          cover.receiveShadow = true;
          scene.add(cover);
          addBoxCollider(cover);
          return cover;
        }
      /* Pointer Lock Indicator */
      .pointer-lock-notice {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(0, 0, 0, 0.8);
          padding: var(--space-md) var(--space-lg);
          border-radius: 8px;
          color: #fff;
          font-size: 22px;
          text-align: center;
          pointer-events: none;
          opacity: 0;
          transition: opacity var(--transition-normal);
      }

      .pointer-lock-notice.visible {
          opacity: 1;
      }

      /* Loading Screen */
      .loading-screen {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: #000;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 2000;
      }

      .loading-screen h2 {
          font-family: 'Orbitron', sans-serif;
          font-size: 40px;
          color: #fff;
          margin-bottom: var(--space-md);
      }

      .loading-bar {
          width: 400px;
          height: 8px;
          background: rgba(255, 255, 255, 0.2);
          border-radius: 4px;
          overflow: hidden;
      }

      .loading-bar-fill {
          height: 100%;
          background: linear-gradient(90deg, #3366ff 0%, #00ff00 100%);
          width: 0%;
          transition: width 0.3s ease;
      }

      @media (prefers-reduced-motion: reduce) {
          * {
              animation-duration: 0.01ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: 0.01ms !important;
              const raycaster = new THREE.Raycaster();
              const shootDir = new THREE.Vector3()
                .subVectors(bot.target.position, bot.position)
                .normalize();
              raycaster.set(bot.position.clone().add(new THREE.Vector3(0, 1, 0)), shootDir);

              const intersects = raycaster.intersectObjects(scene.children, true);

              if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.object.userData.bot) {
                  const hitBot = hit.object.userData.bot;
                  if (hitBot.team !== bot.team) {
                    hitBot.health -= DAMAGE_PER_HIT;
                    if (hitBot.health <= 0) {
                      handleBotElimination(hitBot, bot);
                    }
                  }
                } else if (hit.object.userData.isPlayer) {
                  // Hit player
                  gameState.playerHealth -= DAMAGE_PER_HIT;
                  showDamageIndicator();
                  playSound('damage_taken_sound', 0.5);

                  if (gameState.playerHealth <= 0) {
                    handlePlayerDeath();
                  }
                }
              }

              playSound('gunshot_sound', 0.3);
          </button>
        </div>
      </div>

      <!-- UI Overlay -->
      <div class="ui-overlay">
        <!-- Top HUD -->
        <div class="hud top-hud">
          <div class="score-panel">
            <div class="team-score">
              <div class="team-score-item red">
                <span id="red-score">0</span>
              </div>
              <span style="color: #fff; font-size: 24px;">vs</span>
              <div class="team-score-item blue">
                <span id="blue-score">0</span>
              </div>
            </div>
            <div class="timer" id="round-timer">5:00</div>
          </div>
          <div class="kill-feed" id="kill-feed"></div>
        </div>

        <!-- Bottom HUD -->
        <div class="hud bottom-hud">
          <div class="health-ammo">

        <!-- Damage Vignette -->

        <!-- Hit Marker -->
        <div class="hit-marker" id="hit-marker"></div>

        <!-- Elimination Notice -->
        <div class="elimination-notice" id="elimination-notice">ELIMINATED</div>

        <!-- Respawn Screen -->
        <div class="respawn-screen" id="respawn-screen">

        <div class="pointer-lock-notice" id="pointer-lock-notice">Click to control camera</div>

        <!-- Virtual Joysticks (Mobile) -->
        <div class="virtual-joystick" id="move-joystick">
          <div class="joystick-base"></div>
          <div class="joystick-stick"></div>
        </div>
        <div class="virtual-joystick" id="look-joystick">
          <div class="joystick-base"></div>
          <div class="joystick-stick"></div>
        </div>

        <!-- Mobile Shoot Button -->
        <button class="mobile-shoot-btn" id="mobile-shoot-btn"></button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      /**
       * Arena Showdown
       *
       * A 3D team-based first-person shooter where players join Red or Blue team
       * and compete to eliminate opponents in a tactical arena with bases,
       * central building, and sniper towers.
       *
       * Features:
       * - FPS controls with WASD movement and mouse look
       * - 15v15 AI bot combat
       * - Hitscan shooting with health/damage system
       * - Respawning at team bases
       * - 5-minute rounds with scoring
       * - Mobile support with virtual joysticks
       */

      async function run(mode) {
        const gameWorld = document.getElementById('game-world');
        const canvas = document.getElementById('game-canvas');

        // Initialize Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          75,
          canvas.clientWidth / canvas.clientHeight,
          0.1,
          1000
        );
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Resize handling
        function resizeCanvas() {
          const width = gameWorld.clientWidth;
          const height = gameWorld.clientHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffers = {};
        const textures = {};

        // Collision boxes for environment
        const collidableBoxes = [];

        // Player collision mesh (for bots to shoot at)
        const PLAYER_HEIGHT = 1.8;
        const PLAYER_RADIUS = 0.4;
        const playerGeometry = new THREE.BoxGeometry(PLAYER_RADIUS * 2, PLAYER_HEIGHT, PLAYER_RADIUS * 2);
        const playerMaterial = new THREE.MeshBasicMaterial({ visible: false });
        const playerMesh = new THREE.Mesh(playerGeometry, playerMaterial);
        playerMesh.userData.isPlayer = true;
        scene.add(playerMesh);

        function addBoxCollider(mesh) {
          mesh.updateMatrixWorld();
          const box = new THREE.Box3().setFromObject(mesh);
          collidableBoxes.push(box);
        }

        // Asset preloading
        async function preloadAssets() {
          const assetIds = [
            'reload_sound',
            'hit_marker_sound',
            'damage_taken_sound',
            'elimination_sound',
            'respawn_sound',
            'background_music',
            'victory_sound',
            'defeat_sound',
            'footstep_sound',
            'assault_rifle',
            'muzzle_flash',
          ];

          let loaded = 0;
          const total = assetIds.length;
          const loadingBarFill = document.getElementById('loading-bar-fill');
          const textureLoader = new THREE.TextureLoader();

          for (const id of assetIds) {
            try {
              const assetInfo = lib.getAsset(id);
              if (assetInfo) {
                if (assetInfo.type === 'audio') {
                  const response = await fetch(assetInfo.url);
                  const arrayBuffer = await response.arrayBuffer();
                  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                  audioBuffers[id] = audioBuffer;
                } else {
                  const texture = await textureLoader.loadAsync(assetInfo.url);
                  textures[id] = texture;
                }
              }
            } catch (error) {
              console.error(`Failed to load asset ${id}:`, error);
            }
            loaded++;
            loadingBarFill.style.width = `${(loaded / total) * 100}%`;
          }

          // Hide loading screen
          setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
          }, 500);
        }

        // Play sound function
        function playSound(assetId, volume = 1.0, loop = false) {
          if (!audioBuffers[assetId]) return null;
          const source = audioContext.createBufferSource();
          const gainNode = audioContext.createGain();
          source.buffer = audioBuffers[assetId];
          source.connect(gainNode);
          gainNode.connect(audioContext.destination);
          gainNode.gain.value = volume;
          source.loop = loop;
          source.start(0);
          return { source, gainNode };
        }

        await preloadAssets();

        // Detect mobile
        const isMobile = lib.shouldUseTouchControls();

        // Game configuration (from window.gameConfig)
        const config = window.gameConfig;
        let gameState = {
          phase: 'team-selection', // 'team-selection', 'playing', 'ended'
          playerTeam: null,
          playerHealth: config.gameplay.playerHealth,
          playerAmmo: config.gameplay.ammoCapacity,
          playerReserveAmmo: config.gameplay.ammoCapacity * 3,
          playerPosition: new THREE.Vector3(),
          playerRotation: { yaw: 0, pitch: 0 },
          playerVelocity: new THREE.Vector3(),
          isReloading: false,
          reloadTimer: 0,
          shootCooldown: 0,
          respawnTimer: 0,
          isRespawning: false,
          redScore: 0,
          blueScore: 0,
          roundTime: config.match.roundDuration * 60,
          bots: [],
          killFeed: [],
          backgroundMusic: null,
        };

        // Constants
        const MOVEMENT_SPEED = 8 * config.gameplay.movementSpeed;
        const FIRE_RATE = 0.1; // 600 RPM
        const RELOAD_TIME = 2;
        const DAMAGE_PER_HIT = 20 * config.gameplay.damageMultiplier;
        const BOT_DETECT_RADIUS = 50;
        const BOT_SHOOT_RANGE = 40;

        // Arena layout
        const ARENA_SIZE = 200;
        const BASE_POSITIONS = {
          red: new THREE.Vector3(0, 0, -ARENA_SIZE / 2 + 20),
          blue: new THREE.Vector3(0, 0, ARENA_SIZE / 2 - 20),
        };

        // Input state
        const keys = {};
        const mouse = { deltaX: 0, deltaY: 0 };
        let pointerLocked = false;

        // Mobile joysticks
        const joysticks = {
          move: { active: false, touchId: null, baseX: 0, baseY: 0, stickX: 0, stickY: 0 },
          look: { active: false, touchId: null, baseX: 0, baseY: 0, stickX: 0, stickY: 0 },
        };

        // Create scene lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4 * config.arena.lightingIntensity);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(
          0xffffff,
          0.8 * config.arena.lightingIntensity
        );
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -ARENA_SIZE / 2;
        directionalLight.shadow.camera.right = ARENA_SIZE / 2;
        directionalLight.shadow.camera.top = ARENA_SIZE / 2;
        directionalLight.shadow.camera.bottom = -ARENA_SIZE / 2;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Skybox and fog
        const skyColors = {
          day: 0x87ceeb,
          sunset: 0xff6b4a,
          night: 0x1a1a2e,
          overcast: 0x808080,
        };
        scene.background = new THREE.Color(skyColors[config.arena.skyboxTheme]);

        if (config.arena.fogDensity !== 'none') {
          const fogDensity = config.arena.fogDensity === 'light' ? 0.005 : 0.01;
          scene.fog = new THREE.FogExp2(skyColors[config.arena.skyboxTheme], fogDensity);
        }

        // Ground
        const groundTextures = {
          concrete: 0x808080,
          grass: 0x228b22,
          sand: 0xdaa520,
          metal: 0x5a5a5a,
        };
        const groundGeometry = new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2);
        const groundMaterial = new THREE.MeshLambertMaterial({
          color: groundTextures[config.arena.groundTexture],
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Create arena structures
        const weaponGroup = new THREE.Group();
        const weaponBobGroup = new THREE.Group();
        const weaponRecoilGroup = new THREE.Group();
        
        let weaponMesh, muzzleFlashMesh;

        function initWeapon() {
          if (!textures['assault_rifle']) return;

          // Weapon Sprite
          const weaponGeometry = new THREE.PlaneGeometry(1.2, 1.2);
          const weaponMaterial = new THREE.MeshBasicMaterial({
            map: textures['assault_rifle'],
            transparent: true,
            depthTest: false,
            depthWrite: false
          });
          weaponMesh = new THREE.Mesh(weaponGeometry, weaponMaterial);
          
          // Position it in first person view
          weaponMesh.position.set(0.4, -0.35, -0.6);
          
          // Muzzle Flash
          if (textures['muzzle_flash']) {
            const flashGeometry = new THREE.PlaneGeometry(0.4, 0.4);
            const flashMaterial = new THREE.MeshBasicMaterial({
              map: textures['muzzle_flash'],
              transparent: true,
              opacity: 0,
              depthTest: false,
              depthWrite: false,
              blending: THREE.AdditiveBlending
            });
            muzzleFlashMesh = new THREE.Mesh(flashGeometry, flashMaterial);
            muzzleFlashMesh.position.set(0.35, -0.1, -0.65);
            weaponRecoilGroup.add(muzzleFlashMesh);
          }

          weaponRecoilGroup.add(weaponMesh);
          weaponBobGroup.add(weaponRecoilGroup);
          weaponGroup.add(weaponBobGroup);
          
          camera.add(weaponGroup);
          scene.add(camera);
          
          weaponGroup.visible = false;
        }

        function createBase(color, position) {
          const base = new THREE.Group();

          // Main structure
          const baseGeometry = new THREE.BoxGeometry(20, 5, 20);
          const baseMaterial = new THREE.MeshLambertMaterial({ color });
          const baseStructure = new THREE.Mesh(baseGeometry, baseMaterial);
          baseStructure.position.y = 2.5;
          baseStructure.castShadow = true;
          baseStructure.receiveShadow = true;
          base.add(baseStructure);

          // Roof
          const roofGeometry = new THREE.BoxGeometry(22, 0.5, 22);
          const roofMaterial = new THREE.MeshLambertMaterial({ color: color });
          const roof = new THREE.Mesh(roofGeometry, roofMaterial);
          roof.position.y = 5.25;
          roof.castShadow = true;
          base.add(roof);

          // Platform
          const platformGeometry = new THREE.BoxGeometry(24, 1, 24);
          const platformMaterial = new THREE.MeshLambertMaterial({ color: 0x404040 });
          const platform = new THREE.Mesh(platformGeometry, platformMaterial);
          platform.position.y = 6;
          platform.castShadow = true;
          platform.receiveShadow = true;
          base.add(platform);

          base.position.copy(position);
          scene.add(base);
          return base;
        }

        function createCentralBuilding() {
          const building = new THREE.Group();

          // Ground floor
          const floor1Geometry = new THREE.BoxGeometry(30, 4, 30);
          const floor1Material = new THREE.MeshLambertMaterial({ color: 0x808080 });
          const floor1 = new THREE.Mesh(floor1Geometry, floor1Material);
          floor1.position.y = 2;
          floor1.castShadow = true;
          floor1.receiveShadow = true;
          building.add(floor1);

          // Second floor
          const floor2Geometry = new THREE.BoxGeometry(30, 4, 30);
          const floor2Material = new THREE.MeshLambertMaterial({ color: 0x707070 });
          const floor2 = new THREE.Mesh(floor2Geometry, floor2Material);
          floor2.position.y = 6;
          floor2.castShadow = true;
          floor2.receiveShadow = true;
          building.add(floor2);

          // Walls with windows
          const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x606060 });
          const wallGeometry = new THREE.BoxGeometry(30, 4, 2);

          const walls = [
            { pos: [0, 6, 15], rot: 0 },
            { pos: [0, 6, -15], rot: 0 },
            { pos: [15, 6, 0], rot: Math.PI / 2 },
            { pos: [-15, 6, 0], rot: Math.PI / 2 },
          ];

          walls.forEach((w) => {
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(...w.pos);
            wall.rotation.y = w.rot;
            wall.castShadow = true;
            wall.receiveShadow = true;
            building.add(wall);
          });

          building.position.set(0, 0, 0);
          scene.add(building);
          return building;
        }

        function createSniperTower(position) {
          const tower = new THREE.Group();

          // Tower structure
          const towerGeometry = new THREE.BoxGeometry(3, 15, 3);
          const towerMaterial = new THREE.MeshLambertMaterial({ color: 0x505050 });
          const towerMesh = new THREE.Mesh(towerGeometry, towerMaterial);
          towerMesh.position.y = 7.5;
          towerMesh.castShadow = true;
          towerMesh.receiveShadow = true;
          tower.add(towerMesh);
          addBoxCollider(towerMesh);

          // Platform
          const platformGeometry = new THREE.BoxGeometry(5, 0.5, 5);
          const platformMaterial = new THREE.MeshLambertMaterial({ color: 0x606060 });
          const platform = new THREE.Mesh(platformGeometry, platformMaterial);
          platform.position.y = 15;
          platform.castShadow = true;
          platform.receiveShadow = true;
          tower.add(platform);
          addBoxCollider(platform);

          tower.position.copy(position);
          scene.add(tower);
          return tower;
        }

        function createCover(position, type = 'crate') {
          const coverGeometry =
            type === 'crate'
              ? new THREE.BoxGeometry(1.5, 1.5, 1.5)
              : new THREE.BoxGeometry(3, 1, 0.5);
          const coverMaterial = new THREE.MeshLambertMaterial({
            color: type === 'crate' ? 0x8b4513 : 0x606060,
          });
          const cover = new THREE.Mesh(coverGeometry, coverMaterial);
          cover.position.copy(position);
          cover.position.y = type === 'crate' ? 0.75 : 0.5;
          cover.castShadow = true;
          cover.receiveShadow = true;
          scene.add(cover);
          addBoxCollider(cover);
          return cover;
        }

        // Create arena
        const redBase = createBase(0xff3333, BASE_POSITIONS.red);
        const blueBase = createBase(0x3366ff, BASE_POSITIONS.blue);
        const centralBuilding = createCentralBuilding();

        const towers = [
          createSniperTower(new THREE.Vector3(60, 0, 60)),
          createSniperTower(new THREE.Vector3(-60, 0, 60)),
          createSniperTower(new THREE.Vector3(60, 0, -60)),
          createSniperTower(new THREE.Vector3(-60, 0, -60)),
        ];

        // Scatter cover objects
        const coverPositions = [
          new THREE.Vector3(20, 0, 20),
          new THREE.Vector3(-20, 0, 20),
          new THREE.Vector3(20, 0, -20),
          new THREE.Vector3(-20, 0, -20),
          new THREE.Vector3(40, 0, 0),
          new THREE.Vector3(-40, 0, 0),
          new THREE.Vector3(0, 0, 40),
          new THREE.Vector3(0, 0, -40),
        ];

        coverPositions.forEach((pos, i) => {
          createCover(pos, i % 2 === 0 ? 'crate' : 'barrier');
        });

        // Bot system
        function createBot(team) {
          const bot = {
            team,
            health: config.gameplay.playerHealth,
            position: new THREE.Vector3(),
            rotation: { yaw: 0, pitch: 0 },
            velocity: new THREE.Vector3(),
            state: 'patrol', // patrol, chase, attack, cover
            target: null,
            patrolPoint: null,
            shootCooldown: 0,
            mesh: null,
          };

          // Create bot mesh
          const botGeometry = new THREE.BoxGeometry(0.6, 1.8, 0.4);
          const botMaterial = new THREE.MeshLambertMaterial({
            color: team === 'red' ? 0xff3333 : 0x3366ff,
          });
          bot.mesh = new THREE.Mesh(botGeometry, botMaterial);
          bot.mesh.castShadow = true;
          bot.mesh.userData.bot = bot;
          scene.add(bot.mesh);

          // Spawn at team base
          const spawnBase = team === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
          bot.position.copy(spawnBase);
          bot.position.x += (Math.random() - 0.5) * 10;
          bot.position.z += (Math.random() - 0.5) * 10;
          bot.mesh.position.copy(bot.position);
          bot.mesh.position.y = 0.9;

          return bot;
        }

        function initializeBots() {
          gameState.bots = [];
          const botsPerTeam = config.teams.teamSize - 1; // -1 for player

          for (let i = 0; i < botsPerTeam; i++) {
            gameState.bots.push(createBot('red'));
            gameState.bots.push(createBot('blue'));
          }
        }

        function updateBotAI(bot, deltaTime) {
          // Dead bots don't act
          if (bot.health <= 0) return;

          // Update shoot cooldown
          if (bot.shootCooldown > 0) {
            bot.shootCooldown -= deltaTime;
          }

          // Find nearest enemy
          let nearestEnemy = null;
          let nearestDist = BOT_DETECT_RADIUS;

          // Check player
          if (
            gameState.playerTeam !== bot.team &&
            gameState.playerHealth > 0 &&
            !gameState.isRespawning
          ) {
            const dist = bot.position.distanceTo(gameState.playerPosition);
            if (dist < nearestDist) {
              nearestEnemy = { position: gameState.playerPosition, isPlayer: true };
              nearestDist = dist;
            }
          }

          // Check other bots
          gameState.bots.forEach((otherBot) => {
            if (otherBot.team !== bot.team && otherBot.health > 0) {
              const dist = bot.position.distanceTo(otherBot.position);
              if (dist < nearestDist) {
                nearestEnemy = { position: otherBot.position, bot: otherBot };
                nearestDist = dist;
              }
            }
          });

          // State machine
          if (nearestEnemy && nearestDist < BOT_SHOOT_RANGE) {
            bot.state = 'attack';
            bot.target = nearestEnemy;
          } else if (nearestEnemy && nearestDist < BOT_DETECT_RADIUS) {
            bot.state = 'chase';
            bot.target = nearestEnemy;
          } else {
            bot.state = 'patrol';
            bot.target = null;
          }

          // Execute behavior
          if (bot.state === 'patrol') {
            if (!bot.patrolPoint || bot.position.distanceTo(bot.patrolPoint) < 5) {
              // Pick new patrol point
              const points = [
                BASE_POSITIONS.red,
                BASE_POSITIONS.blue,
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(30, 0, 30),
                new THREE.Vector3(-30, 0, 30),
                new THREE.Vector3(30, 0, -30),
                new THREE.Vector3(-30, 0, -30),
              ];
              bot.patrolPoint = points[Math.floor(Math.random() * points.length)].clone();
            }

            // Move toward patrol point
            const dir = new THREE.Vector3().subVectors(bot.patrolPoint, bot.position).normalize();
            bot.velocity.copy(dir).multiplyScalar(MOVEMENT_SPEED * 0.7);
            bot.rotation.yaw = Math.atan2(dir.x, dir.z);
          } else if (bot.state === 'chase') {
            // Move toward target
            const dir = new THREE.Vector3()
              .subVectors(bot.target.position, bot.position)
              .normalize();
            bot.velocity.copy(dir).multiplyScalar(MOVEMENT_SPEED);
            bot.rotation.yaw = Math.atan2(dir.x, dir.z);
          } else if (bot.state === 'attack') {
            // Stop and shoot
            bot.velocity.set(0, 0, 0);

            // Aim at target
            const dir = new THREE.Vector3()
              .subVectors(bot.target.position, bot.position)
              .normalize();
            bot.rotation.yaw = Math.atan2(dir.x, dir.z);

            // Strafe randomly
            if (Math.random() < 0.02) {
              const strafeDir = Math.random() < 0.5 ? -1 : 1;
              bot.velocity.x = Math.cos(bot.rotation.yaw) * MOVEMENT_SPEED * 0.5 * strafeDir;
              bot.velocity.z = -Math.sin(bot.rotation.yaw) * MOVEMENT_SPEED * 0.5 * strafeDir;
            }

            // Shoot
            if (bot.shootCooldown <= 0) {
              // Raycasting
              const raycaster = new THREE.Raycaster();
              const shootDir = new THREE.Vector3()
                .subVectors(bot.target.position, bot.position)
                .normalize();
              raycaster.set(bot.position.clone().add(new THREE.Vector3(0, 1, 0)), shootDir);

              const intersects = raycaster.intersectObjects(scene.children, true);

              if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.object.userData.bot) {
                  const hitBot = hit.object.userData.bot;
                  if (hitBot.team !== bot.team) {
                    hitBot.health -= DAMAGE_PER_HIT;
                    if (hitBot.health <= 0) {
                      handleBotElimination(hitBot, bot);
                    }
                  }
                } else if (hit.object.userData.isPlayer) {
                  // Hit player
                  gameState.playerHealth -= DAMAGE_PER_HIT;
                  showDamageIndicator();
                  playSound('damage_taken_sound', 0.5);

                  if (gameState.playerHealth <= 0) {
                    handlePlayerDeath();
                  }
                }
              }

              playSound('gunshot_sound', 0.3);
              bot.shootCooldown = FIRE_RATE;
            }
          }

          // Apply velocity
          bot.position.add(bot.velocity.clone().multiplyScalar(deltaTime));

          // Keep in bounds
          bot.position.x = Math.max(-ARENA_SIZE, Math.min(ARENA_SIZE, bot.position.x));
          bot.position.z = Math.max(-ARENA_SIZE, Math.min(ARENA_SIZE, bot.position.z));

          // Update mesh
          bot.mesh.position.copy(bot.position);
          bot.mesh.position.y = 0.9;
          bot.mesh.rotation.y = bot.rotation.yaw;
        }

        function handleBotElimination(victim, killer) {
          victim.health = 0;
          victim.mesh.visible = false;

          // Update score
          if (killer.team === 'red') {
            gameState.redScore++;
          } else {
            gameState.blueScore++;
          }

          // Add to kill feed
          addToKillFeed(`Bot (${killer.team})`, `Bot (${victim.team})`);

          // Respawn after delay
          setTimeout(() => {
            victim.health = config.gameplay.playerHealth;
            const spawnBase = victim.team === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
            victim.position.copy(spawnBase);
            victim.position.x += (Math.random() - 0.5) * 10;
            victim.position.z += (Math.random() - 0.5) * 10;
            victim.mesh.position.copy(victim.position);
            victim.mesh.visible = true;
            playSound('respawn_sound', 0.5);
          }, config.match.respawnDelay * 1000);
        }

        // Player controls
        function setupControls() {
          // Keyboard
          window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (
              e.key === 'r' &&
              !gameState.isReloading &&
              gameState.playerAmmo < config.gameplay.ammoCapacity
            ) {
              startReload();
            }
          });

          window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
          });

          // Mouse
          if (!isMobile) {
            canvas.addEventListener('click', () => {
              if (!pointerLocked && gameState.phase === 'playing') {
                canvas.requestPointerLock();
              }
            });

            document.addEventListener('pointerlockchange', () => {
              pointerLocked = document.pointerLockElement === canvas;
              document
                .getElementById('pointer-lock-notice')
                .classList.toggle('visible', !pointerLocked && gameState.phase === 'playing');
            });

            document.addEventListener('mousemove', (e) => {
              if (pointerLocked) {
                mouse.deltaX = e.movementX;
                mouse.deltaY = e.movementY;
              }
            });

            canvas.addEventListener('mousedown', (e) => {
              if (e.button === 0 && pointerLocked && gameState.phase === 'playing') {
                shoot();
              }
            });
          }

          // Touch controls
          if (isMobile) {
            document.getElementById('mobile-shoot-btn').classList.add('visible');

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

            document.getElementById('mobile-shoot-btn').addEventListener('touchstart', (e) => {
              e.preventDefault();
              shoot();
            });
          }

          // Team selection
          document.getElementById('join-red').addEventListener('click', () => {
            joinTeam('red');
          });

          document.getElementById('join-blue').addEventListener('click', () => {
            joinTeam('blue');
          });

          // Play again
          document.getElementById('play-again-btn').addEventListener('click', () => {
            resetGame();
          });
        }

        function handleTouchStart(e) {
          e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const x = touch.clientX;
            const y = touch.clientY;

            // Left half - move joystick
            if (x < canvas.width / 2 && !joysticks.move.active) {
              joysticks.move.active = true;
              joysticks.move.touchId = touch.identifier;
              joysticks.move.baseX = x;
              joysticks.move.baseY = y;
              joysticks.move.stickX = x;
              joysticks.move.stickY = y;
              updateJoystickDisplay('move');
            }
            // Right half - look joystick
            else if (x >= canvas.width / 2 && !joysticks.look.active) {
              joysticks.look.active = true;
              joysticks.look.touchId = touch.identifier;
              joysticks.look.baseX = x;
              joysticks.look.baseY = y;
              joysticks.look.stickX = x;
              joysticks.look.stickY = y;
              updateJoystickDisplay('look');
            }
          }
        }

        function handleTouchMove(e) {
          e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];

            if (joysticks.move.active && touch.identifier === joysticks.move.touchId) {
              const dx = touch.clientX - joysticks.move.baseX;
              const dy = touch.clientY - joysticks.move.baseY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const maxDist = 60;

              if (dist > maxDist) {
                joysticks.move.stickX = joysticks.move.baseX + (dx / dist) * maxDist;
                joysticks.move.stickY = joysticks.move.baseY + (dy / dist) * maxDist;
              } else {
                joysticks.move.stickX = touch.clientX;
                joysticks.move.stickY = touch.clientY;
              }
              updateJoystickDisplay('move');
            }

            if (joysticks.look.active && touch.identifier === joysticks.look.touchId) {
              const dx = touch.clientX - joysticks.look.baseX;
              const dy = touch.clientY - joysticks.look.baseY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const maxDist = 60;

              if (dist > maxDist) {
                joysticks.look.stickX = joysticks.look.baseX + (dx / dist) * maxDist;
                joysticks.look.stickY = joysticks.look.baseY + (dy / dist) * maxDist;
              } else {
                joysticks.look.stickX = touch.clientX;
                joysticks.look.stickY = touch.clientY;
              }
              updateJoystickDisplay('look');
            }
          }
        }

        function handleTouchEnd(e) {
          e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];

            if (joysticks.move.active && touch.identifier === joysticks.move.touchId) {
              joysticks.move.active = false;
              joysticks.move.touchId = null;
              document.getElementById('move-joystick').classList.remove('active');
            }

            if (joysticks.look.active && touch.identifier === joysticks.look.touchId) {
              joysticks.look.active = false;
              joysticks.look.touchId = null;
              document.getElementById('look-joystick').classList.remove('active');
            }
          }
        }

        function updateJoystickDisplay(type) {
          const joystick = joysticks[type];
          const element = document.getElementById(`${type}-joystick`);

          if (joystick.active) {
            element.classList.add('active');
            element.style.left = joystick.baseX + 'px';
            element.style.top = joystick.baseY + 'px';

            const stick = element.querySelector('.joystick-stick');
            const dx = joystick.stickX - joystick.baseX;
            const dy = joystick.stickY - joystick.baseY;
            stick.style.left = `calc(50% + ${dx}px)`;
            stick.style.top = `calc(50% + ${dy}px)`;
          }
        }

        // Game functions
        function joinTeam(team) {
          gameState.playerTeam = team;
          gameState.phase = 'playing';
          document.getElementById('team-selection').style.display = 'none';

          // Spawn player
          const spawnBase = team === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
          gameState.playerPosition.copy(spawnBase);
          gameState.playerPosition.y = PLAYER_HEIGHT / 2;
          camera.position.copy(gameState.playerPosition);

          // Initialize bots
          initializeBots();

          // Initialize Weapon
          initWeapon();
          if (weaponGroup) weaponGroup.visible = false;

          // Start background music
          gameState.backgroundMusic = playSound('background_music', 0.3, true);

          // Show pointer lock notice
          if (!isMobile) {
            document.getElementById('pointer-lock-notice').classList.add('visible');
            setTimeout(() => {
              document.getElementById('pointer-lock-notice').classList.remove('visible');
            }, 3000);
          }
        }

        function shoot() {
          if (gameState.shootCooldown > 0 || gameState.isReloading || gameState.isRespawning)
            return;
          if (gameState.playerAmmo <= 0) {
            if (gameState.playerReserveAmmo > 0) {
              startReload();
            }
            return;
          }

          gameState.playerAmmo--;
          gameState.shootCooldown = FIRE_RATE;
          updateHUD();

          playSound('gunshot_sound', 0.5);

          // Weapon Kick
          if (weaponRecoilGroup) {
            weaponRecoilGroup.position.z += 0.05;
            weaponRecoilGroup.rotation.x += 0.05;
          }
          
          // Muzzle Flash
          if (muzzleFlashMesh) {
            muzzleFlashMesh.material.opacity = 1;
            muzzleFlashMesh.rotation.z = Math.random() * Math.PI * 2;
            setTimeout(() => {
              if (muzzleFlashMesh) muzzleFlashMesh.material.opacity = 0;
            }, 50);
          }

          // Raycasting
          const raycaster = new THREE.Raycaster();
          const shootDir = new THREE.Vector3(0, 0, -1);
          shootDir.applyQuaternion(camera.quaternion);
          raycaster.set(camera.position, shootDir);

          const intersects = raycaster.intersectObjects(scene.children, true).filter(h => !h.object.userData.isPlayer);

          if (intersects.length > 0) {
            const hit = intersects[0];
            if (hit.object.userData.bot) {
              const bot = hit.object.userData.bot;
              if (bot.team !== gameState.playerTeam) {
                bot.health -= DAMAGE_PER_HIT;
                showHitMarker();
                playSound('hit_marker_sound', 0.7);

                if (bot.health <= 0) {
                  gameState[gameState.playerTeam + 'Score']++;
                  addToKillFeed('You', `Bot (${bot.team})`);
                  playSound('elimination_sound', 0.6);
                  showEliminationNotice();
                  handleBotElimination(bot, { team: gameState.playerTeam });
                }
              }
            }
          }
        }

        function startReload() {
          if (gameState.isReloading || gameState.playerReserveAmmo <= 0) return;

          gameState.isReloading = true;
          gameState.reloadTimer = RELOAD_TIME;
          playSound('reload_sound', 0.5);
        }

        function completeReload() {
          const ammoNeeded = config.gameplay.ammoCapacity - gameState.playerAmmo;
          const ammoToReload = Math.min(ammoNeeded, gameState.playerReserveAmmo);

          gameState.playerAmmo += ammoToReload;
          gameState.playerReserveAmmo -= ammoToReload;
          gameState.isReloading = false;

          updateHUD();
        }

        function handlePlayerDeath() {
          gameState.isRespawning = true;
          gameState.respawnTimer = config.match.respawnDelay;
          document.getElementById('respawn-screen').classList.add('active');

          // Update enemy score
          const enemyTeam = gameState.playerTeam === 'red' ? 'blue' : 'red';
          gameState[enemyTeam + 'Score']++;

          playSound('damage_taken_sound', 0.8);
        }

        function respawnPlayer() {
          gameState.isRespawning = false;
          gameState.playerHealth = config.gameplay.playerHealth;
          gameState.playerAmmo = config.gameplay.ammoCapacity;
          gameState.playerReserveAmmo = config.gameplay.ammoCapacity * 3;

          const spawnBase =
            gameState.playerTeam === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
          gameState.playerPosition.copy(spawnBase);
          gameState.playerPosition.y = PLAYER_HEIGHT / 2;
          camera.position.copy(gameState.playerPosition);

          document.getElementById('respawn-screen').classList.remove('active');
          playSound('respawn_sound', 0.6);
          updateHUD();
        }

        function addToKillFeed(killer, victim) {
          const killerClass =
            killer.includes('red') || (killer === 'You' && gameState.playerTeam === 'red')
              ? 'killer'
              : '';
          const victimClass =
            victim.includes('blue') || (victim === 'You' && gameState.playerTeam === 'blue')
              ? 'victim'
              : '';

          const item = document.createElement('div');
          item.className = 'kill-feed-item';
          item.innerHTML = `<span class="${killerClass}">${killer}</span> eliminated <span class="${victimClass}">${victim}</span>`;

          const killFeed = document.getElementById('kill-feed');
          killFeed.insertBefore(item, killFeed.firstChild);

          // Keep only last 5
          while (killFeed.children.length > 5) {
            killFeed.removeChild(killFeed.lastChild);
          }
        }

        function showDamageIndicator() {
          const vignette = document.getElementById('damage-vignette');
          vignette.classList.add('active');
          setTimeout(() => vignette.classList.remove('active'), 200);
        }

        function showHitMarker() {
          const marker = document.getElementById('hit-marker');
          marker.classList.remove('active');
          void marker.offsetWidth; // Force reflow
          marker.classList.add('active');
        }

        function showEliminationNotice() {
          const notice = document.getElementById('elimination-notice');
          notice.classList.remove('active');
          void notice.offsetWidth;
          notice.classList.add('active');
        }

        function updateHUD() {
          // Health
          const healthPercent = (gameState.playerHealth / config.gameplay.playerHealth) * 100;
          const healthBar = document.getElementById('health-bar');
          healthBar.style.width = healthPercent + '%';
          healthBar.classList.toggle('low', healthPercent < 50);
          healthBar.classList.toggle('critical', healthPercent < 25);
          document.getElementById('health-text').textContent = Math.max(
            0,
            Math.floor(gameState.playerHealth)
          );

          // Ammo
          document.getElementById('ammo-current').textContent = gameState.playerAmmo;
          document.getElementById('ammo-reserve').textContent = gameState.playerReserveAmmo;

          // Scores
          document.getElementById('red-score').textContent = gameState.redScore;
          document.getElementById('blue-score').textContent = gameState.blueScore;

          // Timer
          const minutes = Math.floor(gameState.roundTime / 60);
          const seconds = Math.floor(gameState.roundTime % 60);
          document.getElementById('round-timer').textContent =
            `${minutes}:${seconds.toString().padStart(2, '0')}`;

          // Minimap
          updateMinimap();
        }

        function updateMinimap() {
          const minimap = document.getElementById('minimap');
          const ctx = minimap.getContext('2d');
          const w = minimap.width;
          const h = minimap.height;
          const scale = w / (ARENA_SIZE * 2);

          ctx.clearRect(0, 0, w, h);

          // Draw arena
          ctx.fillStyle = 'rgba(50, 50, 50, 0.8)';
          ctx.fillRect(0, 0, w, h);

          // Draw bases
          ctx.fillStyle = '#ff3333';
          const redBaseX = (BASE_POSITIONS.red.x + ARENA_SIZE) * scale;
          const redBaseZ = (BASE_POSITIONS.red.z + ARENA_SIZE) * scale;
          ctx.fillRect(redBaseX - 5, redBaseZ - 5, 10, 10);

          ctx.fillStyle = '#3366ff';
          const blueBaseX = (BASE_POSITIONS.blue.x + ARENA_SIZE) * scale;
          const blueBaseZ = (BASE_POSITIONS.blue.z + ARENA_SIZE) * scale;
          ctx.fillRect(blueBaseX - 5, blueBaseZ - 5, 10, 10);

          // Draw player
          ctx.fillStyle = gameState.playerTeam === 'red' ? '#ff6666' : '#6699ff';
          const playerX = (gameState.playerPosition.x + ARENA_SIZE) * scale;
          const playerZ = (gameState.playerPosition.z + ARENA_SIZE) * scale;
          ctx.beginPath();
          ctx.arc(playerX, playerZ, 4, 0, Math.PI * 2);
          ctx.fill();

          // Draw bots (teammates only)
          gameState.bots.forEach((bot) => {
            if (bot.team === gameState.playerTeam && bot.health > 0) {
              ctx.fillStyle = gameState.playerTeam === 'red' ? '#ff9999' : '#99bbff';
              const botX = (bot.position.x + ARENA_SIZE) * scale;
              const botZ = (bot.position.z + ARENA_SIZE) * scale;
              ctx.beginPath();
              ctx.arc(botX, botZ, 2, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }

        function checkRoundEnd() {
          if (gameState.roundTime <= 0) {
            endRound();
          }
        }

        function endRound() {
          gameState.phase = 'ended';

          const endScreen = document.getElementById('end-screen');
          const endTitle = document.getElementById('end-title');
          const finalScore = document.getElementById('final-score');

          const playerWon =
            gameState.redScore > gameState.blueScore
              ? gameState.playerTeam === 'red'
              : gameState.playerTeam === 'blue';

          if (gameState.redScore === gameState.blueScore) {
            endTitle.textContent = 'DRAW';
            endTitle.className = '';
          } else {
            endTitle.textContent = playerWon ? 'VICTORY' : 'DEFEAT';
            endTitle.className = playerWon ? 'victory' : 'defeat';
          }

          finalScore.textContent = `Red Team: ${gameState.redScore} - Blue Team: ${gameState.blueScore}`;
          endScreen.classList.add('active');

          playSound(playerWon ? 'victory_sound' : 'defeat_sound', 0.7);

          // Stop background music
          if (gameState.backgroundMusic) {
            gameState.backgroundMusic.source.stop();
          }
        }

        function resetGame() {
          // Reset scores
          gameState.redScore = 0;
          gameState.blueScore = 0;
          gameState.roundTime = config.match.roundDuration * 60;
          gameState.phase = 'playing';

          // Reset player
          gameState.playerHealth = config.gameplay.playerHealth;
          gameState.playerAmmo = config.gameplay.ammoCapacity;
          gameState.playerReserveAmmo = config.gameplay.ammoCapacity * 3;
          gameState.isRespawning = false;

          const spawnBase =
            gameState.playerTeam === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
          gameState.playerPosition.copy(spawnBase);
          gameState.playerPosition.y = PLAYER_HEIGHT / 2;
          camera.position.copy(gameState.playerPosition);

          // Reset bots
          gameState.bots.forEach((bot) => {
            bot.health = config.gameplay.playerHealth;
            const botSpawnBase = bot.team === 'red' ? BASE_POSITIONS.red : BASE_POSITIONS.blue;
            bot.position.copy(botSpawnBase);
            bot.position.x += (Math.random() - 0.5) * 10;
            bot.position.z += (Math.random() - 0.5) * 10;
            bot.mesh.position.copy(bot.position);
            bot.mesh.visible = true;
          });

          // Clear kill feed
          document.getElementById('kill-feed').innerHTML = '';

          // Hide end screen
          document.getElementById('end-screen').classList.remove('active');

          // Restart background music
          gameState.backgroundMusic = playSound('background_music', 0.3, true);

          updateHUD();
        }

        // Setup controls
        setupControls();

        // Game parameters
        if (mode === 'edit' || mode === 'play') {
          lib.showGameParameters({
            name: 'Arena Showdown Settings',
            params: {
              'Team Size': {
                key: 'teams.teamSize',
                type: 'slider',
                min: 5,
                max: 20,
                step: 1,
              },
              'Bot Difficulty': {
                key: 'teams.botDifficulty',
                type: 'dropdown',
                options: [
                  { label: 'Easy', value: 'easy' },
                  { label: 'Medium', value: 'medium' },
                  { label: 'Hard', value: 'hard' },
                ],
              },
              'Round Duration (min)': {
                key: 'match.roundDuration',
                type: 'slider',
                min: 3,
                max: 10,
                step: 1,
              },
              'Respawn Delay (sec)': {
                key: 'match.respawnDelay',
                type: 'slider',
                min: 1,
                max: 10,
                step: 1,
              },
              'Player Health': {
                key: 'gameplay.playerHealth',
                type: 'slider',
                min: 50,
                max: 200,
                step: 25,
              },
              'Movement Speed': {
                key: 'gameplay.movementSpeed',
                type: 'slider',
                min: 0.5,
                max: 2,
                step: 0.1,
              },
              'Damage Multiplier': {
                key: 'gameplay.damageMultiplier',
                type: 'slider',
                min: 0.5,
                max: 2,
                step: 0.1,
              },
              'Ammo Capacity': {
                key: 'gameplay.ammoCapacity',
                type: 'slider',
                min: 30,
                max: 60,
                step: 10,
              },
              'Skybox Theme': {
                key: 'arena.skyboxTheme',
                type: 'dropdown',
                options: [
                  { label: 'Day', value: 'day' },
                  { label: 'Sunset', value: 'sunset' },
                  { label: 'Night', value: 'night' },
                  { label: 'Overcast', value: 'overcast' },
                ],
              },
              'Ground Texture': {
                key: 'arena.groundTexture',
                type: 'dropdown',
                options: [
                  { label: 'Concrete', value: 'concrete' },
                  { label: 'Grass', value: 'grass' },
                  { label: 'Sand', value: 'sand' },
                  { label: 'Metal', value: 'metal' },
                ],
              },
              'Lighting Intensity': {
                key: 'arena.lightingIntensity',
                type: 'slider',
                min: 0.5,
                max: 1.5,
                step: 0.1,
              },
              'Fog Density': {
                key: 'arena.fogDensity',
                type: 'dropdown',
                options: [
                  { label: 'None', value: 'none' },
                  { label: 'Light', value: 'light' },
                  { label: 'Heavy', value: 'heavy' },
                ],
              },
            },
          });
        }

        // Game loop
        let lastTime = performance.now();

        function gameLoop(timestamp) {
          let deltaTime = (timestamp - lastTime) / 1000;
          deltaTime = Math.min(deltaTime, 0.11); // Limit to prevent large jumps
          lastTime = timestamp;

          // Clear canvas
          renderer.clear();

          if (gameState.phase === 'playing') {
            // Update player movement and look
            if (!gameState.isRespawning) {
              const moveVector = new THREE.Vector3();
              let isMoving = false;

              if (isMobile) {
                // Mobile joystick input
                if (joysticks.move.active) {
                  const dx = joysticks.move.stickX - joysticks.move.baseX;
                  const dy = joysticks.move.stickY - joysticks.move.baseY;
                  const deadzone = 10;

                  if (Math.abs(dx) > deadzone || Math.abs(dy) > deadzone) {
                    moveVector.x = dx / 60;
                    moveVector.z = dy / 60;
                    isMoving = true;
                  }
                }

                // Look joystick
                if (joysticks.look.active) {
                  const dx = joysticks.look.stickX - joysticks.look.baseX;
                  const dy = joysticks.look.stickY - joysticks.look.baseY;
                  const sensitivity = 0.05;

                  gameState.playerRotation.yaw -= dx * sensitivity * deltaTime;
                  gameState.playerRotation.pitch -= dy * sensitivity * deltaTime;
                  gameState.playerRotation.pitch = Math.max(
                    -Math.PI / 2 + 0.1,
                    Math.min(Math.PI / 2 - 0.1, gameState.playerRotation.pitch)
                  );
                }
              } else {
                // Desktop keyboard input
                if (keys['w'] || keys['arrowup']) moveVector.z = -1;
                if (keys['s'] || keys['arrowdown']) moveVector.z = 1;
                if (keys['a'] || keys['arrowleft']) moveVector.x = -1;
                if (keys['d'] || keys['arrowright']) moveVector.x = 1;
                isMoving = moveVector.length() > 0;

                // Mouse look
                if (pointerLocked) {
                  const sensitivity = 0.002;
                  gameState.playerRotation.yaw -= mouse.deltaX * sensitivity;
                  gameState.playerRotation.pitch -= mouse.deltaY * sensitivity;
                  gameState.playerRotation.pitch = Math.max(
                    -Math.PI / 2 + 0.1,
                    Math.min(Math.PI / 2 - 0.1, gameState.playerRotation.pitch)
                  );
                }
                mouse.deltaX = 0;
                mouse.deltaY = 0;
              }

              // Update Weapon Bobbing & Recoil
              if (weaponGroup) {
                weaponGroup.visible = false;
                
                const time = timestamp * 0.005;
                
                // Idle bob
                let bobX = Math.sin(time * 0.5) * 0.005;
                let bobY = Math.cos(time) * 0.005;
                
                if (isMoving) {
                  // Walking bob
                  bobX = Math.sin(time * 2) * 0.02;
                  bobY = Math.abs(Math.cos(time * 2)) * 0.02;
                }
                
                weaponBobGroup.position.x = THREE.MathUtils.lerp(weaponBobGroup.position.x, bobX, 0.1);
                weaponBobGroup.position.y = THREE.MathUtils.lerp(weaponBobGroup.position.y, bobY, 0.1);
                
                // Recoil recovery
                weaponRecoilGroup.position.z = THREE.MathUtils.lerp(weaponRecoilGroup.position.z, 0, 0.2);
                weaponRecoilGroup.rotation.x = THREE.MathUtils.lerp(weaponRecoilGroup.rotation.x, 0, 0.2);
              }

              // Normalize movement
              if (moveVector.length() > 0) {
                moveVector.normalize();

                // Apply rotation
                const rotatedMove = new THREE.Vector3();
                rotatedMove.x =
                  moveVector.x * Math.cos(gameState.playerRotation.yaw) -
                  moveVector.z * Math.sin(gameState.playerRotation.yaw);
                rotatedMove.z =
                  moveVector.x * Math.sin(gameState.playerRotation.yaw) +
                  moveVector.z * Math.cos(gameState.playerRotation.yaw);

                const nextPos = gameState.playerPosition.clone().add(
                  rotatedMove.multiplyScalar(MOVEMENT_SPEED * deltaTime)
                );

                // Collision Detection
                let canMove = true;
                const playerBox = new THREE.Box3().setFromCenterAndSize(
                  nextPos,
                  new THREE.Vector3(PLAYER_RADIUS * 2, PLAYER_HEIGHT, PLAYER_RADIUS * 2)
                );

                for (const box of collidableBoxes) {
                  if (playerBox.intersectsBox(box)) {
                    canMove = false;
                    break;
                  }
                }

                if (canMove) {
                  gameState.playerPosition.copy(nextPos);
                }

                // Keep in bounds
                gameState.playerPosition.x = Math.max(
                  -ARENA_SIZE,
                  Math.min(ARENA_SIZE, gameState.playerPosition.x)
                );
                gameState.playerPosition.z = Math.max(
                  -ARENA_SIZE,
                  Math.min(ARENA_SIZE, gameState.playerPosition.z)
                );
              }

              // Update camera
              camera.position.copy(gameState.playerPosition);
              camera.rotation.order = 'YXZ';
              camera.rotation.y = gameState.playerRotation.yaw;
              camera.rotation.x = gameState.playerRotation.pitch;

              // Update player collision mesh position
              playerMesh.position.copy(gameState.playerPosition);

              // Update shoot cooldown
              if (gameState.shootCooldown > 0) {
                gameState.shootCooldown -= deltaTime;
              }

              // Update reload
              if (gameState.isReloading) {
                gameState.reloadTimer -= deltaTime;
                if (gameState.reloadTimer <= 0) {
                  completeReload();
                }
              }
            } else {
              // Update respawn timer
              if (weaponGroup) weaponGroup.visible = false;
              gameState.respawnTimer -= deltaTime;
              document.getElementById('respawn-timer').textContent = Math.ceil(
                gameState.respawnTimer
              );

              if (gameState.respawnTimer <= 0) {
                respawnPlayer();
              }
            }

            // Update bots
            gameState.bots.forEach((bot) => {
              updateBotAI(bot, deltaTime);
            });

            // Update round timer
            gameState.roundTime -= deltaTime;
            checkRoundEnd();

            // Update HUD
            updateHUD();
          }

          // Render
          renderer.render(scene, camera);

          requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
      }
    </script>
